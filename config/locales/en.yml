# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t 'hello'
#
# In views, this is aliased to just `t`:
#
#     <%= t('hello') %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# The following keys must be escaped otherwise they will not be retrieved by
# the default I18n backend:
#
# true, false, on, off, yes, no
#
# Instead, surround them with single quotes.
#
# en:
#   'true': 'foo'
#
# To learn more, please read the Rails Internationalization guide
# available at https://guides.rubyonrails.org/i18n.html.

en:
  errors:
    messages:
      invites:
        invalid_code: This invitation code is invalid
      something_went_wrong: 'Something went wrong.'
      resource_not_found: 'Requested resource not found'
      not_authorized: 'You are not authorized to perform this action'
      email_verifier:
        email_not_real: must point to a real mail account
        out_of_mail_server: appears to point to dead mail server
        no_mail_server: appears to point to domain which doesn't handle e-mail
        failure:  delivery failed! The email you have entered not found.
        exception: could not be sent
  proposals:
    initialize: 'Started a new %{proposal_type} proposal!'
    locked:
      notice: >
        This proposal has been locked because the call for proposals has closed and a new
        version of the proposal form is now in use. To submit a proposal for the current
        cycle, please start a new proposal. Contact us if you have questions.
      alert: >
        This proposal is locked and cannot be edited. You can view it below.
        Please start a new proposal if you wish to submit for the current cycle.
      unlocked: 'Proposal "%{title}" has been unlocked and set back to draft.'
      not_locked: 'This proposal is not locked.'
    limit_per_type_per_year: 'There is a limit of one %{proposal_type} proposal per year.'
  proposal_forms:
    stale_drafts:
      warning_title: 'Heads up: draft proposals will be locked.'
      warning_body:
        one: >
          There is 1 draft proposal tied to the current active form. Saving this new form
          will lock that draft — its author will be asked to start a fresh proposal.
        other: >
          There are %{count} draft proposals tied to the current active form. Saving this new
          form will lock those drafts — their authors will be asked to start fresh proposals.
    clone_confirm:
      zero: >
        You already have a form for this proposal type in draft/active state. If you continue,
        it will be made inactive. Do you want to continue?
      one: >
        You already have a form for this proposal type in draft/active state. If you continue,
        it will be made inactive and 1 draft proposal tied to the current active form will be
        locked. Do you want to continue?
      other: >
        You already have a form for this proposal type in draft/active state. If you continue,
        it will be made inactive and %{count} draft proposals tied to the current active form
        will be locked. Do you want to continue?
    ui:
      no_proposals: No proposals found
      current_year: 'Current year (%{year})'
      no_year_set: 'Empty year'
    form:
      add_organizers: 'Add Supporting Organizers:'
      add_participants: 'Add Participants:'
      new_participants_invite: Click here to send out additional participant invitation
      new_organizers_invite: Click here to send out additional organizer invitation
      invite_participants: Invite Participant(s)
      invite_organizers: Invite Organizer(s)
      fill_in_title: Please fill in title and save before proceeding
      preamble: LaTeX Preamble
      preamble_note: If you need to use custom LaTeX macros, enter them here to add them to the document preamble.
      bibliography: Bibliography
      bibliography_note: If you have a LaTeX bibliography, please enter it in this field. It will be included when you click the "Print Proposal" button.
      see_guidelines: See Guidelines for more information
